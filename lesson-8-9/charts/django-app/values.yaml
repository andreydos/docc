image:
  repository: 469935552561.dkr.ecr.us-west-2.amazonaws.com/lesson-8-9-django
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8000

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi

config:
  POSTGRES_DB: django_db
  POSTGRES_NAME: django_db
  POSTGRES_USER: django_user
  POSTGRES_PASSWORD: django_password
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
