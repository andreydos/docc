argoNamespace: argocd

applications:
  - name: django-app
    project: default
    source:
      repoURL: https://github.com/andreydos/docc.git
      path: lesson-8-9/charts/django-app
      targetRevision: lesson-8-9
      helm:
        valueFiles:
          - values.yaml
    destination:
      server: https://kubernetes.default.svc
      namespace: default
    syncPolicy:
      automated:
        prune: true
        selfHeal: true

repositories: []
