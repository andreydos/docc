controller:
  admin:
    username: admin
    password: admin123

  image:
    tag: "2.541.3-lts-jdk17"

  serviceType: LoadBalancer
  servicePort: 80
  targetPort: 8080

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  installLatestSpecifiedPlugins: true
  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - github:latest
    - job-dsl:latest

  JCasC:
    defaultConfig: true
    overwriteConfiguration: true

serviceAccount:
  create: true
  name: jenkins-sa

rbac:
  create: true

persistence:
  enabled: true
  storageClass: ebs-sc
  size: 10Gi
